<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F3D3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nosso Pote">
<title>Nosso Pote</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230F3D3E%22/><circle cx=%2250%22 cy=%2252%22 r=%2230%22 fill=%22%23F2C14E%22/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--teal:#0F3D3E;--teal2:#16595A;--coin:#F2C14E;--paper:#FBFAF6;--ink:#17262A;--mute:#6B7C7E;--line:#E4E2D9;--in:#1E7A5C;--out:#D6492B;
--d:"Bricolage Grotesque","Trebuchet MS",sans-serif;--b:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:17px/1.4 var(--b);background:var(--paper);color:var(--ink);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.hide{display:none!important}
/* login */
#login{min-height:100%;background:var(--teal);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:32px 28px}
#login h1{font:800 44px/1 var(--d);color:var(--coin);margin-bottom:8px}
#login p{margin-bottom:28px;opacity:.85}
#login input{width:100%;padding:16px;border-radius:14px;border:2px solid transparent;font:inherit;margin-bottom:12px}
#login .go{width:100%;padding:16px;border-radius:14px;background:var(--coin);color:var(--teal);font:800 18px var(--d)}
#err{color:#FFB4A2;margin-top:12px;min-height:24px}
/* topo */
header{background:var(--teal);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 22px 30px;border-radius:0 0 32px 32px}
.bar{display:flex;justify-content:space-between;align-items:center}
.logo{font:800 20px var(--d);color:var(--coin)}
.sair{font-size:14px;opacity:.75;padding:8px}
.mes{display:flex;align-items:center;gap:6px;margin:18px 0 4px}
.mes button{width:44px;height:44px;border-radius:50%;background:var(--teal2);color:#fff;font-size:22px}
.mes b{font:600 18px var(--d);min-width:150px;text-align:center;text-transform:capitalize}
.lbl{opacity:.8;font-size:15px}
.saldo{font:800 clamp(46px,16vw,68px)/1.05 var(--d);color:var(--coin);letter-spacing:-.02em}
.saldo.neg{color:#FFB4A2}
.dois{display:flex;gap:10px;margin-top:18px}
.dois div{flex:1;background:var(--teal2);border-radius:16px;padding:12px 14px}
.dois small{display:block;opacity:.8;font-size:14px}
.dois strong{font:700 20px var(--d)}
/* corpo */
main{padding:22px 20px;max-width:640px;margin:0 auto}
h2{font:700 18px var(--d);margin:0 0 10px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.cats span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px}
.cats em{font-style:normal;font-weight:600;margin-left:4px}
.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--mute);font-size:14px}
.val{font:700 18px var(--d);white-space:nowrap}
.x{width:44px;height:44px;border-radius:50%;color:var(--mute);font-size:20px}
.vazio{color:var(--mute);padding:30px 0;text-align:center}
/* botoes */
.fab{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--paper) 35%)}
.fab button{flex:1;padding:18px;border-radius:18px;color:#fff;font:800 19px var(--d);box-shadow:0 6px 18px rgba(15,61,62,.25)}
.fab .e{background:var(--in)}.fab .s{background:var(--out)}
/* folha */
#folha{position:fixed;inset:0;background:rgba(15,40,42,.55);display:flex;align-items:flex-end}
#folha form{background:var(--paper);width:100%;max-width:640px;margin:0 auto;border-radius:28px 28px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){#folha form{animation:none}}
#folha h3{font:800 24px var(--d);margin-bottom:14px}
#folha input{width:100%;padding:15px;border-radius:14px;border:2px solid var(--line);font:inherit;background:#fff;margin-bottom:12px}
#valor{font:800 34px var(--d)!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:16px}
.chips button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.salvar{width:100%;padding:17px;border-radius:16px;color:#fff;font:800 19px var(--d)}
.cancelar{width:100%;padding:14px;color:var(--mute)}
</style>
</head>
<body>

<section id="login" class="hide">
  <h1>Nosso Pote</h1>
  <p>As contas de vocês dois, no mesmo lugar.</p>
  <input id="em" type="email" placeholder="E-mail" autocomplete="username">
  <input id="se" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="go" id="entrar">Entrar</button>
  <div id="err" role="alert"></div>
</section>

<div id="app" class="hide">
  <header>
    <div class="bar"><span class="logo">Nosso Pote</span><button class="sair" id="sair">Sair</button></div>
    <div class="mes"><button id="ant" aria-label="Mês anterior">‹</button><b id="mesnome"></b><button id="prox" aria-label="Próximo mês">›</button></div>
    <div class="lbl">Sobrou no mês</div>
    <div class="saldo" id="saldo">R$ 0,00</div>
    <div class="dois"><div><small>Entrou</small><strong id="tin">R$ 0,00</strong></div><div><small>Saiu</small><strong id="tout">R$ 0,00</strong></div></div>
  </header>
  <main>
    <div id="cats" class="cats"></div>
    <h2>Lançamentos</h2>
    <div id="lista"></div>
  </main>
  <div class="fab">
    <button class="e" id="bE">+ Entrou</button>
    <button class="s" id="bS">− Saiu</button>
  </div>
</div>

<div id="folha" class="hide">
  <form id="form">
    <h3 id="ftit"></h3>
    <input id="valor" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off" required>
    <input id="desc" placeholder="O que foi? (ex.: mercado)" autocomplete="off">
    <div class="chips" id="chips"></div>
    <button class="salvar" id="salvar" type="submit">Salvar</button>
    <button class="cancelar" id="cancelar" type="button">Cancelar</button>
  </form>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,query,where,onSnapshot,addDoc,deleteDoc,doc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO FIREBASE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyB11TquZGYE26Qv9p5iGRb8s7WeIeB3Af0",
  authDomain: "financeiro-obaratao.firebaseapp.com",
  projectId: "financeiro-obaratao",
  appId: "1:989470934830:web:ee22458114bdca1351dcbf"
};
/* ================================================================ */

const CATS_SAIDA=["Mercado","Casa","Contas","Transporte","Lazer","Saúde","Outros"];
const CATS_ENTRADA=["Salário","Extra","Outros"];

const $=id=>document.getElementById(id);
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let user=null,unsub=null,tipo="saida",cat="",itens=[];
let hoje=new Date(),ano=hoje.getFullYear(),mes=hoje.getMonth();

const chave=()=>ano+"-"+String(mes+1).padStart(2,"0");
const quem=e=>{const n=(e||"").split("@")[0];return n.charAt(0).toUpperCase()+n.slice(1)};

onAuthStateChanged(auth,u=>{
  user=u;
  $("login").classList.toggle("hide",!!u);
  $("app").classList.toggle("hide",!u);
  if(u)ouvir();else if(unsub){unsub();unsub=null}
});

$("entrar").onclick=async()=>{
  $("err").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("se").value)}
  catch(e){$("err").textContent="E-mail ou senha incorretos. Confira e tente de novo."}
};
$("sair").onclick=()=>signOut(auth);

function ouvir(){
  if(unsub)unsub();
  $("mesnome").textContent=new Date(ano,mes,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  unsub=onSnapshot(query(collection(db,"lancamentos"),where("mes","==",chave())),
    s=>{itens=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.dia||0)-(a.dia||0)||(b.criado?.seconds||0)-(a.criado?.seconds||0));desenhar()},
    ()=>{$("lista").innerHTML='<div class="vazio">Não foi possível carregar. Confira a internet e as regras do Firebase.</div>'});
}

function desenhar(){
  let ent=0,sai=0;const por={};
  itens.forEach(i=>{if(i.tipo==="entrada")ent+=i.valor;else{sai+=i.valor;por[i.cat]=(por[i.cat]||0)+i.valor}});
  const s=ent-sai;
  $("saldo").textContent=brl(s);$("saldo").classList.toggle("neg",s<0);
  $("tin").textContent=brl(ent);$("tout").textContent=brl(sai);
  $("cats").innerHTML=Object.entries(por).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<span>${c}<em>${brl(v)}</em></span>`).join("");
  $("lista").innerHTML=itens.length?itens.map(i=>`
    <div class="item"><span class="dot" style="background:var(--${i.tipo==="entrada"?"in":"out"})"></span>
    <div class="t"><b>${esc(i.desc||i.cat)}</b><small>${esc(i.cat)} · ${esc(i.por)} · ${String(i.dia).padStart(2,"0")}/${String(mes+1).padStart(2,"0")}</small></div>
    <span class="val" style="color:var(--${i.tipo==="entrada"?"in":"out"})">${i.tipo==="entrada"?"+":"−"}${brl(i.valor)}</span>
    <button class="x" data-id="${i.id}" aria-label="Apagar">✕</button></div>`).join("")
    :'<div class="vazio">Nada lançado neste mês. Toque em “Entrou” ou “Saiu” para começar.</div>';
}
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("lista").onclick=async e=>{
  const b=e.target.closest(".x");if(!b)return;
  if(confirm("Apagar este lançamento? Ele some para os dois."))await deleteDoc(doc(db,"lancamentos",b.dataset.id));
};
$("ant").onclick=()=>{mes--;if(mes<0){mes=11;ano--}ouvir()};
$("prox").onclick=()=>{mes++;if(mes>11){mes=0;ano++}ouvir()};

function abrir(t){
  tipo=t;
  $("ftit").textContent=t==="entrada"?"Quanto entrou?":"Quanto saiu?";
  $("salvar").style.background=t==="entrada"?"var(--in)":"var(--out)";
  const lista=t==="entrada"?CATS_ENTRADA:CATS_SAIDA;cat=lista[0];
  $("chips").innerHTML=lista.map((c,i)=>`<button type="button" class="${i?"":"on"}">${c}</button>`).join("");
  $("valor").value="";$("desc").value="";
  $("folha").classList.remove("hide");setTimeout(()=>$("valor").focus(),50);
}
$("bE").onclick=()=>abrir("entrada");
$("bS").onclick=()=>abrir("saida");
$("cancelar").onclick=()=>$("folha").classList.add("hide");
$("folha").onclick=e=>{if(e.target.id==="folha")$("folha").classList.add("hide")};
$("chips").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  [...$("chips").children].forEach(x=>x.classList.remove("on"));b.classList.add("on");cat=b.textContent;
};
$("form").onsubmit=async e=>{
  e.preventDefault();
  const v=parseFloat($("valor").value.replace(/\./g,"").replace(",","."));
  if(!(v>0)){$("valor").focus();return}
  const agora=new Date(),mesmo=agora.getFullYear()===ano&&agora.getMonth()===mes;
  $("salvar").disabled=true;
  try{
    await addDoc(collection(db,"lancamentos"),{tipo,valor:Math.round(v*100)/100,desc:$("desc").value.trim(),cat,
      por:quem(user.email),mes:chave(),dia:mesmo?agora.getDate():1,criado:serverTimestamp()});
    $("folha").classList.add("hide");
  }catch(err){alert("Não salvou. Confira a internet e tente de novo.")}
  $("salvar").disabled=false;
};
</script>
</body>
</html>
